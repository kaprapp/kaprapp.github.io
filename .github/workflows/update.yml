name: Ranní aktualizace dat

on:
  schedule:
    - cron: "40 3 * * *"   # 5:40 letního / 4:40 zimního času
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/update.yml"]

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Stáhnout aktuální data
        run: node scripts/update.mjs
      - name: Uložit změny
        run: |
          git config user.name "Kapr bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Žádné změny."
          else
            git commit -m "Data $(TZ=Europe/Prague date +'%-d. %-m. %Y %H:%M')"
            git pull --rebase
            git push
          fi
